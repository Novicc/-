button{font:inherit;color:inherit;cursor:pointer}

.scene{color:var(--red);font-size:13px}
.name{font-size:34px;text-align:center;color:var(--red);margin:6px 0 0;letter-spacing:.15em}
.ttl{text-align:center;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.row b{width:2em}.row .bar{flex:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 18px;margin:8px 6px 0}
.c{text-align:center}
</style>
